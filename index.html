<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Chat Room</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #1e293b; padding: 12px; }

        .chat-wrapper { width: 100%; max-width: 420px; height: 85vh; max-height: 680px; background: #ffffff; border-radius: 20px; box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08); display: flex; flex-direction: column; overflow: hidden; border: 1px solid rgba(226, 232, 240, 0.8); position: relative; }
        .chat-header { background: #4f46e5; color: white; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
        .chat-header h3 { font-size: 14px; font-weight: 600; }
        .badge { font-size: 10.5px; background: rgba(255, 255, 255, 0.2); padding: 3px 8px; border-radius: 20px; cursor: pointer; }
        .badge:hover { background: rgba(255, 255, 255, 0.3); }

        .chat-messages { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f8fafc; }
        .message { max-width: 85%; padding: 10px 12px 22px 12px; border-radius: 12px; font-size: 12.5px; line-height: 1.4; word-wrap: break-word; position: relative; user-select: none; }
        .message.incoming { background: #ffffff; color: #334155; align-self: flex-start; border-bottom-left-radius: 3px; border: 1px solid #e2e8f0; }
        .message.outgoing { background: #4f46e5; color: white; align-self: flex-end; border-bottom-right-radius: 3px; cursor: pointer; }
        .message .sender-name { font-size: 10px; display: block; margin-bottom: 3px; opacity: 0.85; font-weight: 700; }
        .message .edited-label { font-size: 8.5px; opacity: 0.7; margin-left: 4px; font-style: italic; }
        
        /* Style Jam ala WhatsApp */
        .message-time {
            font-size: 9.5px;
            position: absolute;
            bottom: 5px;
            right: 10px;
            opacity: 0.75;
        }
        .message.incoming .message-time { color: #64748b; }
        .message.outgoing .message-time { color: rgba(255, 255, 255, 0.85); }

        .chat-media-img { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 6px; display: block; object-fit: cover; cursor: pointer; }
        .chat-media-video { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 6px; display: block; }
        .chat-media-audio { width: 100%; max-width: 220px; margin-top: 6px; display: block; }
        
        .chat-file-card {
            margin-top: 6px; padding: 9px 12px; background: rgba(0,0,0,0.05); border-radius: 8px;
            display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; border: 1px solid rgba(0,0,0,0.1);
        }
        .message.outgoing .chat-file-card { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; }
        .link-text-anchor { color: inherit; text-decoration: underline; word-break: break-all; }

        .chat-input-area { padding: 10px 14px; background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; align-items: center; }
        .chat-input-area input[type="text"] { flex: 1; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 10px; outline: none; font-size: 12.5px; }
        .chat-input-area input[type="text"]:focus { border-color: #4f46e5; }

        .btn-attach {
            background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; width: 36px; height: 36px;
            border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px;
        }
        .btn-attach:hover { background: #e2e8f0; color: #0f172a; }
        .chat-input-area button.btn-send { background: #4f46e5; color: white; border: none; padding: 0 14px; height: 36px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 12.5px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 2000; padding: 14px; }
        .modal-content { background: white; padding: 20px; border-radius: 18px; width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 25px 50px rgba(0,0,0,0.25); }
        .modal-content h3 { color: #0f172a; font-size: 16px; font-weight: 700; text-align: center; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 11px; font-weight: 600; color: #475569; }
        .modal-content input { padding: 9px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12.5px; outline: none; background: #fff; }
        .btn-submit { background: #4f46e5; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12.5px; width: 100%; text-align: center; }
        .btn-submit:hover { background: #4338ca; }
        .info-box { font-size: 11px; color: #475569; background: #f1f5f9; padding: 8px; border-radius: 8px; border-left: 3px solid #4f46e5; }

        /* Pop-up Menu Action (Edit/Hapus) */
        .action-popup { display: none; position: absolute; background: white; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border: 1px solid #e2e8f0; z-index: 1500; overflow: hidden; width: 130px; }
        .action-popup button { width: 100%; padding: 10px 12px; background: none; border: none; text-align: left; font-size: 12px; font-weight: 600; color: #334155; cursor: pointer; }
        .action-popup button:hover { background: #f1f5f9; }
        .action-popup button.delete-btn { color: #dc2626; }
        .action-popup button.delete-btn:hover { background: #fee2e2; }

        @media (max-width: 768px) {
            body { padding: 0; align-items: flex-end; }
            .chat-wrapper { width: 100%; height: 100vh; max-height: 100vh; border-radius: 0; border: none; }
        }
    </style>
</head>
<body>

    <div class="chat-wrapper" id="chatWrapper">
        <div class="chat-header">
            <h3>Public Chat 🔴Live</h3>
            <span class="badge" id="userBadge" onclick="openNameModal()" title="Klik untuk ganti nama">Nama: Tamu</span>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <input type="file" id="fileInput" style="display:none" onchange="handleFileSelected(event)">
            <button class="btn-attach" onclick="document.getElementById('fileInput').click()" title="Kirim File/Foto">📎</button>
            <input type="text" id="messageInput" placeholder="Ketik pesan..." onkeypress="checkEnter(event)">
            <button class="btn-send" onclick="sendMessage()">Kirim</button>
        </div>

        <!-- POP-UP EDIT/HAPUS -->
        <div class="action-popup" id="actionPopup">
            <button onclick="triggerEdit()">✏️ Edit Pesan</button>
            <button class="delete-btn" onclick="triggerDelete()">🗑️ Hapus Pesan</button>
        </div>
    </div>

    <!-- MODAL SET NAMA -->
    <div class="modal" id="nameModal">
        <div class="modal-content">
            <h3>Masukkan Nama Kamu</h3>
            <div class="info-box">Login Menu By Bibixse</div>
            <div class="form-group">
                <label>Nama Panggilan</label>
                <input type="text" id="usernameInput" placeholder="Masukan Username Kamu Bebas">
            </div>
            <button class="btn-submit" onclick="saveUsername()">Mulai Chat</button>
        </div>
    </div>

    <!-- MODAL EDIT PESAN -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3>Edit Pesan</h3>
            <div class="form-group">
                <label>Pesan Baru</label>
                <input type="text" id="editMessageInput" placeholder="Ubah isi pesan...">
            </div>
            <button class="btn-submit" onclick="saveEditedMessage()">Simpan Perubahan</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC5GI7cqUQB8Gu4NoKGDR4zD0xJ4kUowVw",
            authDomain: "website-chat-8ad83.firebaseapp.com",
            databaseURL: "https://website-chat-8ad83-default-rtdb.firebaseio.com",
            projectId: "website-chat-8ad83",
            storageBucket: "website-chat-8ad83.appspot.com",
            messagingSenderId: "558083628282",
            appId: "1:558083628282:web:1738900d71414b554c3d43",
            measurementId: "G-EQ2Z8W0GD6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Buat ID unik permanen untuk perangkat ini jika belum ada
        let myId = localStorage.getItem('public_chat_uid');
        if (!myId) {
            myId = 'user_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
            localStorage.setItem('public_chat_uid', myId);
        }

        let myName = localStorage.getItem('public_chat_username') || '';
        let selectedMsgKey = null;
        let selectedMsgText = null;

        window.initApp = function() {
            if (!myName) {
                document.getElementById('nameModal').style.display = 'flex';
            } else {
                document.getElementById('nameModal').style.display = 'none';
                document.getElementById('userBadge').innerText = `Nama: ${myName}`;
            }
        }

        window.openNameModal = function() {
            document.getElementById('usernameInput').value = myName;
            document.getElementById('nameModal').style.display = 'flex';
        }

        window.saveUsername = function() {
            let inputVal = document.getElementById('usernameInput').value.trim();
            if (!inputVal) return alert('Nama tidak boleh kosong!');
            myName = inputVal;
            localStorage.setItem('public_chat_username', myName);
            document.getElementById('nameModal').style.display = 'none';
            document.getElementById('userBadge').innerText = `Nama: ${myName}`;
        }

        // Ambil data pesan secara real-time dari satu ruang publik
        onValue(ref(db, 'public_chat/messages/'), (snapshot) => {
            const messages = snapshot.val() || {};
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';

            let keys = Object.keys(messages);
            if (keys.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#94a3b8; font-size:12px; margin-top:30px;">Belum ada pesan. Jadilah yang pertama mengirim pesan!</div>`;
                return;
            }

            keys.forEach(key => {
                let msg = messages[key];
                const div = document.createElement('div');
                div.classList.add('message');

                // Cek kepemilikan berdasarkan ID perangkat, BUKAN nama tampilannya
                let isMe = msg.senderId === myId;
                div.classList.add(isMe ? 'outgoing' : 'incoming');

                let contentHTML = formatMessageContent(msg);
                if (msg.edited) {
                    contentHTML += `<span class="edited-label">(diedit)</span>`;
                }

                let timeString = msg.time || '';

                div.innerHTML = `
                    <span class="sender-name">${msg.sender}</span>
                    ${contentHTML}
                    <span class="message-time">${timeString}</span>
                `;

                // Tambahkan event Klik Kanan & Tekan Tahan (Long Press) HANYA untuk pesan milik sendiri
                if (isMe && !msg.fileData) {
                    let pressTimer;

                    // Klik Kanan (PC)
                    div.addEventListener('contextmenu', function(e) {
                        e.preventDefault();
                        showActionPopup(e, key, msg.text);
                    });

                    // Tekan Tahan / Long Press (HP)
                    div.addEventListener('touchstart', function(e) {
                        pressTimer = setTimeout(() => {
                            let touch = e.touches[0];
                            showActionPopup(touch, key, msg.text);
                        }, 600);
                    });

                    div.addEventListener('touchend', function() {
                        clearTimeout(pressTimer);
                    });
                }

                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        });

        function showActionPopup(e, key, text) {
            selectedMsgKey = key;
            selectedMsgText = text;
            const popup = document.getElementById('actionPopup');
            
            let x = e.clientX || (e.pageX - window.scrollX);
            let y = e.clientY || (e.pageY - window.scrollY);

            popup.style.left = `${Math.min(x, window.innerWidth - 140)}px`;
            popup.style.top = `${Math.min(y, window.innerHeight - 90)}px`;
            popup.style.display = 'block';
        }

        window.addEventListener('click', function(e) {
            const popup = document.getElementById('actionPopup');
            if (!e.target.closest('.message') && !e.target.closest('.action-popup')) {
                popup.style.display = 'none';
            }
        });

        window.triggerEdit = function() {
            document.getElementById('actionPopup').style.display = 'none';
            document.getElementById('editMessageInput').value = selectedMsgText;
            document.getElementById('editModal').style.display = 'flex';
        }

        window.saveEditedMessage = function() {
            let newText = document.getElementById('editMessageInput').value.trim();
            if (!newText) return alert('Pesan tidak boleh kosong!');

            update(ref(db, `public_chat/messages/${selectedMsgKey}`), {
                text: newText,
                edited: true
            });
            document.getElementById('editModal').style.display = 'none';
        }

        window.triggerDelete = function() {
            document.getElementById('actionPopup').style.display = 'none';
            if (confirm('Yakin ingin menghapus pesan ini?')) {
                remove(ref(db, `public_chat/messages/${selectedMsgKey}`));
            }
        }

        window.sendMessage = function() {
            if (!myName) {
                openNameModal();
                return;
            }
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            push(ref(db, 'public_chat/messages/'), {
                senderId: myId, // Simpan ID perangkat agar bisa diedit kapan pun walau nama diganti
                sender: myName,
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
            input.value = '';
        }

        window.checkEnter = function(e) {
            if (e.key === 'Enter') sendMessage();
        }

        window.handleFileSelected = function(event) {
            if (!myName) {
                openNameModal();
                event.target.value = '';
                return;
            }
            const file = event.target.files[0];
            if (!file) return;

            if (file.size < 3.5 * 1024 * 1024) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    push(ref(db, 'public_chat/messages/'), {
                        senderId: myId,
                        sender: myName,
                        text: `[File: ${file.name}]`,
                        fileData: e.target.result,
                        fileType: file.type,
                        fileName: file.name,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    });
                    event.target.value = '';
                };
                reader.readAsDataURL(file);
            } else {
                alert(`File terlalu besar (${(file.size / (1024*1024)).toFixed(1)}MB). Maksimal 3.5MB.`);
                event.target.value = '';
            }
        }

        window.formatMessageContent = function(msg) {
            let html = '';
            if (msg.fileData) {
                if (msg.fileType && msg.fileType.startsWith('image/')) {
                    html += `<img src="${msg.fileData}" class="chat-media-img" onclick="window.open('${msg.fileData}')">`;
                } else if (msg.fileType && msg.fileType.startsWith('video/')) {
                    html += `<video src="${msg.fileData}" controls class="chat-media-video"></video>`;
                } else if (msg.fileType && msg.fileType.startsWith('audio/')) {
                    html += `<audio src="${msg.fileData}" controls class="chat-media-audio"></audio>`;
                }
                html += `
                    <a href="${msg.fileData}" download="${msg.fileName}" class="chat-file-card">
                        <span>📥</span>
                        <div style="overflow:hidden;">
                            <div style="font-weight:700; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${msg.fileName}</div>
                            <div style="font-size:9px; opacity:0.8;">Klik untuk Download</div>
                        </div>
                    </a>
                `;
            } else {
                html += parseLinkAndFormat(msg.text);
            }
            return html;
        }

        window.parseLinkAndFormat = function(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            let match = text.match(urlRegex);
            if (!match) return escapeHtml(text);

            let url = match[0];
            let cleanText = escapeHtml(text.replace(url, ''));
            let fallbackDomain;
            try { fallbackDomain = new URL(url).hostname; } catch(e) { fallbackDomain = "Link"; }

            let fileCardHTML = `
                <a href="${url}" target="_blank" class="file-card" style="margin-top:6px;">
                    <span>📦</span>
                    <div style="overflow:hidden;">
                        <div style="font-weight:700; font-size:11px;">Buka Link / File</div>
                        <div style="font-size:9px; opacity:0.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${fallbackDomain}</div>
                    </div>
                </a>
            `;
            return `${cleanText}<a href="${url}" target="_blank" class="link-text-anchor">${url}</a>${fileCardHTML}`;
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        initApp();
    </script>
</body>
</html>
